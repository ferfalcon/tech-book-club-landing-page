      - name: Stage 4 preflight and repository validation
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI stage check --json
          $CLI validate
          $CLI sync --check

      - name: Commit Stage 4 specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/document-stage-4.yml
