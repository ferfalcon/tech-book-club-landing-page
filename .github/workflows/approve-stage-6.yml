name: Approve Stage 6

on:
  push:
    branches:
      - workflow/stage-6-architecture

permissions:
  contents: write

jobs:
  approve-stage-6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: workflow/stage-6-architecture
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Record Stage 6 approval and validate
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI stage check --json
          $CLI stage review \
            --result "Passed" \
            --evidence "Stage 6 architecture assessment is complete; current repository evidence supports the explicit architecture skip, no separate architecture artifact or profile upgrade is required, and the project owner explicitly approved Stage 6 in ChatGPT on 2026-08-16." \
            --approved-by "Owner"
          $CLI sync
          $CLI validate
          $CLI sync --check
          $CLI context --json

      - name: Commit canonical approval state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/approve-stage-6.yml
          git add .workflow
          git commit -m "Record Stage 6 approval"
          git push origin HEAD:workflow/stage-6-architecture
