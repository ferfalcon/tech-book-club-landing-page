name: Validate P01-T01

on:
  push:
    branches:
      - implementation/p01-t01
    paths:
      - .github/workflows/validate-p01-t01.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/p01-t01
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install browser validation tooling
        working-directory: frontend
        run: |
          pnpm add --save-dev @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start built preview
        working-directory: frontend
        shell: bash
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 > /tmp/tech-book-club-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tech-book-club-preview.log
          exit 1

      - name: Validate responsive layout, semantics, behavior, and keyboard focus
        working-directory: frontend
        shell: bash
        run: |
          cat > validation.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';

          const referenceViewports = [
            { name: 'desktop', width: 1440, height: 900, screenshot: true },
            { name: 'probe-1024', width: 1024, height: 800, screenshot: false },
            { name: 'tablet', width: 768, height: 900, screenshot: true },
            { name: 'probe-600', width: 600, height: 800, screenshot: false },
            { name: 'mobile', width: 375, height: 812, screenshot: true },
            { name: 'probe-320', width: 320, height: 700, screenshot: false },
          ];

          for (const viewport of referenceViewports) {
            test(`reflow and structure: ${viewport.name}`, async ({ page }) => {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });

              await expect(page.locator('h1')).toHaveCount(1);
              await expect(page.locator('h1')).toHaveText('Join the ultimate tech book club');
              await expect(page.locator('#membership-options')).toHaveCount(1);
              await expect(page.locator('.membership-card')).toHaveCount(3);
              await expect(page.locator('.journey-steps > li')).toHaveCount(4);
              await expect(page.locator('.feature-list > li')).toHaveCount(4);

              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
              expect(overflow).toBeLessThanOrEqual(1);

              if (viewport.screenshot) {
                await page.screenshot({ path: `../validation/screenshots/${viewport.name}.png`, fullPage: true });
              }
            });
          }

          test('approved destinations and keyboard focus', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 812 });
            await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });

            await expect(page.locator('a[href="#membership-options"]')).toHaveCount(2);
            await expect(page.locator('.membership-card a[href="#"]')).toHaveCount(3);
            await expect(page.locator('.social-links a[href="#"]')).toHaveCount(2);

            await page.keyboard.press('Tab');
            await expect(page.locator('.skip-link')).toBeFocused();
            await expect(page.locator('.skip-link')).toBeVisible();

            const buttons = page.locator('.button-link');
            const count = await buttons.count();
            expect(count).toBe(5);
            for (let i = 0; i < count; i += 1) {
              const button = buttons.nth(i);
              await button.focus();
              await expect(button).toBeFocused();
              const boxShadow = await button.evaluate((element) => getComputedStyle(element).boxShadow);
              expect(boxShadow).not.toBe('none');
            }
          });
          EOF

          mkdir -p ../validation/screenshots
          pnpm exec playwright test validation.spec.ts --reporter=line --workers=1
          rm validation.spec.ts
          git restore package.json pnpm-lock.yaml

      - name: Record automated checks through workflow CLI
        shell: bash
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI task validation set P01-T01 --name "Production build" --kind Build --required true --status Passed --expected "Production build succeeds" --actual "pnpm build completed successfully on Node 24" --executed-at "$NOW" --evidence "GitHub Actions run $GITHUB_RUN_ID on implementation/p01-t01" --references PLAN-001,PLAN-006
          $CLI task validation set P01-T01 --name "Responsive and reflow" --kind Responsive --required true --status Passed --expected "Reference and probe widths reflow without horizontal overflow" --actual "Playwright passed at 1440, 1024, 768, 600, 375, and 320 CSS pixels" --executed-at "$NOW" --evidence "GitHub Actions run $GITHUB_RUN_ID browser assertions and screenshots" --references PLAN-002,PLAN-003,PLAN-004,PLAN-005,PLAN-006
          $CLI task validation set P01-T01 --name "Accessibility and keyboard" --kind Accessibility --required true --status Passed --expected "Semantic structure and keyboard focus remain operable" --actual "Single h1, semantic lists, named anchors, skip link, and visible CTA focus rings verified with Playwright" --executed-at "$NOW" --evidence "GitHub Actions run $GITHUB_RUN_ID Playwright keyboard assertions" --references PLAN-002,PLAN-003,PLAN-004,PLAN-005,PLAN-006
          $CLI task validation set P01-T01 --name "Approved behavior inspection" --kind Manual --required true --status Passed --expected "Approved anchors and intentionally inert destinations match the specification" --actual "Two membership anchors target #membership-options; three pricing CTAs and two social links retain literal # destinations" --executed-at "$NOW" --evidence "GitHub Actions run $GITHUB_RUN_ID DOM assertions" --references PLAN-002,PLAN-004,PLAN-005,PLAN-006
          $CLI context --json

      - name: Commit validation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow validation/screenshots
          git commit -m "Record P01-T01 automated validation evidence"
          git push origin HEAD:implementation/p01-t01
