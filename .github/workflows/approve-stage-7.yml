name: Approve Stage 7

on:
  push:
    branches:
      - workflow/stage-7-plan
    paths:
      - .github/workflows/approve-stage-7.yml

permissions:
  contents: write

jobs:
  approve-stage-7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-7-plan
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record Stage 7 approval and validate
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI stage check --json
          $CLI stage review --result "Passed" --evidence "Stage 7 repository-aware implementation plan is complete, repository assumptions were verified, the Lite consolidated implementation brief is Reviewed, and the project owner explicitly approved Stage 7 in ChatGPT on 2026-08-16 with the instruction not to start Stage 8." --approved-by "Owner"
          $CLI sync
          $CLI validate
          $CLI sync --check
          $CLI stage check --json
      - name: Commit canonical approval state
        run: |
          set -euo pipefail
          rm .github/workflows/approve-stage-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow WORKFLOW-STATE.md IMPLEMENTATION-BRIEF.md .github/workflows/approve-stage-7.yml
          git commit -m "Record Stage 7 approval"
          git push origin HEAD:workflow/stage-7-plan
