name: Start P01-T01

on:
  push:
    branches:
      - implementation/p01-t01
    paths:
      - .github/workflows/start-p01-t01.yml

permissions:
  contents: write

jobs:
  start-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/p01-t01
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start canonical workflow task
        run: node docs/implementation-workflow/cli/design-workflow.mjs task start P01-T01

      - name: Remove temporary runner and commit canonical state
        shell: bash
        run: |
          rm .github/workflows/start-p01-t01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start P01-T01 workflow task"
          git push origin HEAD:implementation/p01-t01
