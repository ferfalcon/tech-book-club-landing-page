name: Review Stage 1

on:
  push:
    branches:
      - workflow/stage-1-design-audit

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-1-design-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Review Stage 1 and run gated preflight
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI snapshot verify SRC-DS-001 \
            --result Unchanged \
            --method "Connected Figma metadata, screenshots, and Plugin API read-only inspection" \
            --evidence "Verified Figma file N9NGlGjQhwRVdnTZloWweh page 2142:363, including 1440px desktop, 768px tablet, 375px mobile compositions, responsive section components, local variables/text styles, assets, and prototype reactions. No conflicting source state was detected during Stage 1 audit."

          $CLI artifact review ART-DESIGN-AUDIT \
            --evidence "Completed two audit review passes covering scope completeness, source references, responsive evidence, component/state coverage, interactions, assets, accessibility implications, uncertainty, and traceability."

          $CLI validate
          $CLI sync
          $CLI sync --check
          $CLI context --json

          set +e
          $CLI stage check --json | tee /tmp/stage-1-check.json
          CHECK_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$CHECK_STATUS" -eq 0 ]; then
            echo "Stage 1 unexpectedly became recordable before owner approval." >&2
            exit 1
          fi

          grep -q "Stage 1 requires an approved DESIGN-AUDIT" /tmp/stage-1-check.json
          echo "Stage 1 preflight is correctly gated on owner approval."

      - name: Commit reviewed Stage 1 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-stage-1.yml
          git add .workflow DESIGN-AUDIT.md
          git commit -m "Review Stage 1 design audit"
          git push origin HEAD:workflow/stage-1-design-audit
