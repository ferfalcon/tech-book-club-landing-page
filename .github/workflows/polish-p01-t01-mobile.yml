name: Polish P01-T01 mobile fidelity

on:
  push:
    branches:
      - implementation/p01-t01
    paths:
      - .github/workflows/polish-p01-t01-mobile.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/p01-t01
          fetch-depth: 0

      - name: Match mobile membership card width to approved Figma handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/styles/global.css')
          text = path.read_text()
          old = "\t.membership-card {\n\t\twidth: 100%;\n\t}\n\n\t.testimonial blockquote > p"
          new = "\t.membership-card {\n\t\twidth: min(100%, 340px);\n\t}\n\n\t.testimonial blockquote > p"
          if old not in text:
              raise SystemExit('Expected mobile membership-card rule not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary runner and commit
        shell: bash
        run: |
          rm .github/workflows/polish-p01-t01-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/styles/global.css .github/workflows/polish-p01-t01-mobile.yml
          git commit -m "Match mobile pricing card width"
          git push origin HEAD:implementation/p01-t01
