name: Finalize Stage 10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-stage-10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Finalize Stage 10 without advancing
        shell: bash
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          $CLI task unblock P01-T01
          $CLI task validation set P01-T01 \
            --name "Vercel preview verification" \
            --kind Manual \
            --required true \
            --status Passed \
            --expected "A READY Vercel deployment for the final implementation is available and verified before completion" \
            --actual "Vercel deployment dpl_HsVeYdVbYQDNL8fcVyzEnTSKiaRc is READY for production merge commit 548ac26c82662efc8e0b64e3cc72c4ef38540434, and the live project URL returned HTTP 200 with the implemented Tech Book Club page." \
            --executed-at "$NOW" \
            --evidence "Vercel deployment dpl_HsVeYdVbYQDNL8fcVyzEnTSKiaRc; live URL https://tech-book-club-landing-page-ferfalcon.vercel.app/ verified HTTP 200 in ChatGPT on 2026-08-16; project owner confirmed deployed and live" \
            --references PLAN-006
          $CLI task complete P01-T01 --commit "$(git rev-parse HEAD)"
          $CLI stage review \
            --result Passed \
            --evidence "P01-T01 completed with all required validation checks passed. Vercel production deployment is READY and the live URL returned HTTP 200. Project owner explicitly approved Stage 10 in ChatGPT on 2026-08-16 and instructed not to advance to the next stage." \
            --approved-by Owner
          $CLI context --json

      - name: Remove temporary runner and commit canonical state
        shell: bash
        run: |
          rm .github/workflows/finalize-stage-10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Stage 10 approval"
          git push origin HEAD:main
