name: Apply Stage 4

on:
  push:
    branches:
      - workflow/stage-4-specification

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-4-specification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply embedded specification
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/document-stage-4.yml').read_text()
          brief_path = Path('IMPLEMENTATION-BRIEF.md')
          brief = brief_path.read_text()

          def extract(name):
              match = re.search(rf"{name} = r'''(.*?)'''", source, re.S)
              if not match:
                  raise SystemExit(f'Could not extract {name}')
              return match.group(1)

          section4 = extract('section4')
          section9 = extract('section9')
          section10 = extract('section10')

          start = brief.index('## 4. Specification')
          end = brief.index('## 5. Repository Context')
          brief = brief[:start] + section4 + '\n\n' + brief[end:]

          start = brief.index('## 9. Risks, Assumptions, and Questions')
          end = brief.index('## 10. Traceability')
          brief = brief[:start] + section9 + '\n\n' + brief[end:]

          start = brief.index('## 10. Traceability')
          end = brief.index('## 11. Review Pass 1')
          brief = brief[:start] + section10 + '\n\n' + brief[end:]

          brief = brief.replace(
              'Reserved for the complete Lite implementation-brief review at Stage 5. Stage 2 requirement-specific and Stage 3 design-specific review passes are recorded in their owning sections.',
              'Reserved for the complete Lite implementation-brief review at Stage 5. Stage 2 requirement-specific, Stage 3 design-specific, and Stage 4 specification-specific review passes are recorded in their owning sections.'
          )
          brief = brief.replace(
              'Reserved for the complete Lite implementation-brief review at Stage 8. Stage 2 requirement-specific and Stage 3 design-specific review passes are recorded in their owning sections.',
              'Reserved for the complete Lite implementation-brief review at Stage 8. Stage 2 requirement-specific, Stage 3 design-specific, and Stage 4 specification-specific review passes are recorded in their owning sections.'
          )

          brief_path.write_text(brief)
          PY

      - name: Stage 4 preflight and repository validation
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI stage check --json
          $CLI validate
          $CLI sync --check

      - name: Commit Stage 4 specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/document-stage-4.yml .github/workflows/apply-stage-4.yml
          git add IMPLEMENTATION-BRIEF.md
          git commit -m "Define Stage 4 testable behavior"
          git push origin HEAD:workflow/stage-4-specification
