name: Initialize design workflow

on:
  push:
    branches:
      - workflow/initialize-implementation

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/initialize-implementation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize workflow
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs init \
            --name "Tech book club landing page" \
            --profile Lite \
            --mode Gated \
            --control cli-managed \
            --design "https://www.figma.com/design/N9NGlGjQhwRVdnTZloWweh/tech-book-club-landing-page?node-id=2142-363" \
            --repository .
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check

      - name: Commit initialized workflow state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/initialize-design-workflow.yml
          git add .workflow SOURCE-BASELINE.md PROJECT-CONTEXT.md WORKFLOW-STATE.md
          git commit -m "Initialize implementation workflow"
          git push origin HEAD:workflow/initialize-implementation
