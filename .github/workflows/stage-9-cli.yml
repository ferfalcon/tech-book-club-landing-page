            --approved-by "Owner"
          $CLI task ready P01-T01

          $CLI stage check --json
          $CLI stage review \
            --result Passed \
            --evidence "Stage 9 decomposition defines one coherent Ready Lite implementation task covering PLAN-001 through PLAN-006, with an approved task artifact and required structured validation checks; owner approved Stage 9 continuation on 2026-08-16." \
            --approved-by "Owner"

          $CLI sync --check
