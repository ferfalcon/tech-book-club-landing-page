name: Start Stage 11

on:
  push:
    branches:
      - workflow/stage-11-final-review
    paths:
      - .github/workflows/start-stage-11.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 11 branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-11-final-review
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Advance canonical workflow to Stage 11
        shell: bash
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI stage check --json
          $CLI stage advance
          $CLI context --json
          $CLI sync --check

      - name: Remove temporary runner and commit canonical state
        shell: bash
        run: |
          rm .github/workflows/start-stage-11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start Stage 11 final review"
          git push origin HEAD:workflow/stage-11-final-review
