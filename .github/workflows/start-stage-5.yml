name: Start Stage 5

on:
  push:
    branches:
      - workflow/stage-5-document-review

permissions:
  contents: write

jobs:
  start-stage-5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-5-document-review
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advance to Stage 5
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI context --json
          $CLI stage advance
          $CLI context --json
          $CLI validate
          $CLI sync --check

      - name: Commit Stage 5 state and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/start-stage-5.yml
          git add .workflow IMPLEMENTATION-BRIEF.md
          git commit -m "Advance workflow to Stage 5"
          git push origin HEAD:workflow/stage-5-document-review
