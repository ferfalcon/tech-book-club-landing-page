name: Review Stage 11

on:
  push:
    branches:
      - workflow/stage-11-final-review
    paths:
      - .github/workflows/review-stage-11.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 11 branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-11-final-review
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Register runtime and review evidence
        shell: bash
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI snapshot add \
            --kind runtime \
            --id SRC-RUN-001 \
            --role "Validation runtime" \
            --reference "https://tech-book-club-landing-page-4bf54njsc-fer-falcons-team.vercel.app" \
            --pin Versioned \
            --status Active
          $CLI snapshot verify SRC-DS-001 \
            --result Unchanged \
            --method "Connected Figma screenshot re-verification" \
            --evidence "Stage 11 rechecked current Figma frames 2142:1298, 2142:1911, and 2142:2091 on page 2142:363; the approved desktop, tablet, and mobile compositions remain available with no material source drift detected."
          $CLI snapshot verify SRC-REPO-002 \
            --result "Expected workflow output" \
            --method "GitHub commit lineage and frontend-tree comparison" \
            --evidence "SRC-REPO-002 commit e5b55d0da6cf7f27492b1f5583153cbc476ae05d descends from SRC-REPO-001. Compared with production merge 548ac26c82662efc8e0b64e3cc72c4ef38540434, its only delta is the temporary Stage 10 finalizer workflow; frontend application content is identical."
          $CLI snapshot verify SRC-RUN-001 \
            --result "Expected workflow output" \
            --method "Vercel deployment, build, live HTTP, and runtime-error inspection" \
            --evidence "Vercel deployment dpl_HsVeYdVbYQDNL8fcVyzEnTSKiaRc is READY for production commit 548ac26c82662efc8e0b64e3cc72c4ef38540434; build completed successfully, the live page returned HTTP 200, and no runtime errors were found in the previous day. SRC-REPO-002 has no frontend delta from that deployed commit."
          $CLI artifact review ART-IMPLEMENTATION-REVIEW \
            --evidence "Stage 11 final review is complete. Lineage, design, build, responsive, keyboard/focus, runtime, and static-page checks were reviewed; IMPL-001 records an open hero-heading contrast failure, so the narrative result is Implementation requires corrections."
          $CLI stage check --json
          $CLI context --json
          $CLI sync --check

      - name: Remove temporary runner and commit canonical state
        shell: bash
        run: |
          rm .github/workflows/review-stage-11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Stage 11 review evidence"
          git push origin HEAD:workflow/stage-11-final-review
