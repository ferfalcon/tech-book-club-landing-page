name: Record Stage 8 approval

on:
  push:
    branches:
      - workflow/stage-8-plan-review

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-8-plan-review
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Stage 8 state
        run: node docs/implementation-workflow/cli/design-workflow.mjs context --json

      - name: Record owner approval
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs artifact approve ART-IMPLEMENTATION-BRIEF \
            --evidence "Project owner explicitly approved Stage 8 in ChatGPT on 2026-08-16 and instructed the workflow not to start the next stage." \
            --approved-by "Owner"
          node docs/implementation-workflow/cli/design-workflow.mjs stage review \
            --result Passed \
            --evidence "Stage 8 adversarial plan review is complete, corrections are incorporated, the Lite implementation brief is approved, and the project owner explicitly approved Stage 8 while instructing the workflow not to start Stage 9." \
            --approved-by "Owner"

      - name: Validate without advancing
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs stage check --json
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check
          git diff --check

      - name: Commit approved Stage 8 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/approve-stage-8.yml
          git add .workflow
          git commit -m "Approve Stage 8 plan review"
          git push origin HEAD:workflow/stage-8-plan-review
