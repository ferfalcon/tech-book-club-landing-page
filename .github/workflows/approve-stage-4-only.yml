name: Approve Stage 4 Only

on:
  push:
    branches:
      - workflow/stage-4-specification

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-4-specification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Stage 4 approval without advancing
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI stage check --json
          $CLI stage review \
            --result Passed \
            --evidence "Stage 4 specification is complete, testable, reviewed, source-traceable, and explicitly approved by the project owner in ChatGPT on 2026-08-16. Owner explicitly requested not to start Stage 5." \
            --approved-by "Owner"

          $CLI context --json
          $CLI validate
          $CLI sync --check

      - name: Commit approval state and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/approve-stage-4-only.yml
          git add .workflow IMPLEMENTATION-BRIEF.md
          git commit -m "Approve Stage 4 without advancing"
          git push origin HEAD:workflow/stage-4-specification
