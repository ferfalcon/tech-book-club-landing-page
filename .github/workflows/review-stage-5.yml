name: Review Stage 5 Documentation

on:
  push:
    branches:
      - workflow/stage-5-document-review

permissions:
  contents: write

jobs:
  review-stage-5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-5-document-review
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify active inputs
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI snapshot verify SRC-DS-001 --result "Unchanged" --method "Connected Figma metadata inspection before Stage 5" --evidence "On 2026-08-16, connected Figma metadata inspection of page 2142:363 confirmed desktop 2142:1298, tablet 2142:1911, mobile 2142:2091, Components, Style Guide, Visuals, and Section Components remain present with no material structural conflict with the approved audit."
          $CLI snapshot verify SRC-REPO-001 --result "Unchanged" --method "GitHub immutable-commit lineage and branch comparison before Stage 5" --evidence "Immutable baseline commit 82471d57b717786adc9c2f9a83cd6a5cd696768f remains the merge base and ancestor of the Stage 5 branch; comparison through Stage 5 entry contains workflow and documentation outputs and no frontend application changes."

      - name: Apply Stage 5 documentation corrections
        run: python .github/scripts/review-stage-5.py

      - name: Review consolidated brief and preflight
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI artifact review IMPLEMENTATION-BRIEF --evidence "Stage 5 Lite Review Pass 1 completed after correcting cross-document inconsistencies, stale downstream dispositions, profile ownership references, and review-stage wording."
          $CLI sync
          $CLI validate
          $CLI sync --check
          $CLI context --json
          $CLI stage check --json

      - name: Commit reviewed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-stage-5.yml .github/scripts/review-stage-5.py
          git add .workflow DESIGN-AUDIT.md IMPLEMENTATION-BRIEF.md PROJECT-CONTEXT.md WORKFLOW-STATE.md
          git commit -m "Review Stage 5 documentation consistency"
          git push origin HEAD:workflow/stage-5-document-review
