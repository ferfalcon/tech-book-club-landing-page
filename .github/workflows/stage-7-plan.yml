name: Build Stage 7 Plan

on:
  push:
    branches:
      - workflow/stage-7-plan

permissions:
  contents: write

jobs:
  stage-7-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: workflow/stage-7-plan
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Advance to Stage 7 and verify repository input
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI stage check --json
          $CLI stage advance
          $CLI snapshot verify SRC-REPO-001 \
            --result "Expected workflow output" \
            --method "GitHub repository lineage and frontend tree inspection before Stage 7 planning" \
            --evidence "The immutable repository input commit remains in lineage. Changes since that input are approved workflow/documentation outputs plus immediately reverted Stage 7 setup placeholders; the frontend tree remains the unimplemented Astro starter with one index.astro route, Layout.astro, Welcome.astro, starter assets, Astro as the only application dependency, and no application implementation changes."
          $CLI artifact reopen IMPLEMENTATION-BRIEF \
            --evidence "Stage 7 adds repository context and the repository-aware Lite implementation plan."

      - name: Write repository-aware plan
        run: python .github/scripts/stage7_plan.py

      - name: Review plan and run Stage 7 preflight
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI artifact review IMPLEMENTATION-BRIEF \
            --evidence "Stage 7 repository-aware plan completed after two planning reviews covering repository accuracy, file/dependency/command feasibility, traceability, ordering, accessibility, responsive behavior, states, validation, and risks."
          $CLI sync
          $CLI validate
          $CLI sync --check
          $CLI context --json
          $CLI stage check --json

      - name: Commit Stage 7 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-7-plan.yml .github/scripts/stage7_plan.py
          git add .workflow IMPLEMENTATION-BRIEF.md WORKFLOW-STATE.md
          git commit -m "Document Stage 7 implementation plan"
          git push origin HEAD:workflow/stage-7-plan
