name: Approve Stage 3

on:
  push:
    branches:
      - workflow/stage-3-design-intent

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-3-design-intent
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Approve Stage 3 and advance
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI stage check --json
          $CLI stage review \
            --result Passed \
            --evidence "Stage 3 design intent is complete, reviewed, source-traceable, and explicitly approved by the project owner in ChatGPT on 2026-08-16." \
            --approved-by "Owner"
          $CLI stage advance

          $CLI context --json
          $CLI validate
          $CLI sync --check

      - name: Commit Stage 4 entry state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/approve-stage-3.yml
          git add .workflow IMPLEMENTATION-BRIEF.md
          git commit -m "Approve Stage 3 and begin specification"
          git push origin HEAD:workflow/stage-3-design-intent
