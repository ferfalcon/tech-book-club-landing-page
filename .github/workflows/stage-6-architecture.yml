name: Evaluate Stage 6 Architecture

on:
  push:
    branches:
      - workflow/stage-6-architecture

permissions:
  contents: write

jobs:
  stage-6-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: workflow/stage-6-architecture
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Advance to Stage 6 and record architecture decision
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI stage check --json
          $CLI stage advance
          $CLI architecture decide not-required \
            --reason "Repository inspection after the Stage 5 merge confirms a single index.astro route, starter Astro component/layout structure, Astro as the only application dependency, an empty Astro config, and no backend, API, persistence, authentication, shared state, client framework integration, migration, or server-runtime concern. The approved specification also explicitly excludes those behaviors, so the Lite implementation can keep structural constraints in the specification and Stage 7 plan without a separate architecture artifact."
          $CLI artifact reopen IMPLEMENTATION-BRIEF \
            --evidence "Stage 6 architecture evaluation adds the explicit architecture-skip decision to the consolidated Lite brief."

      - name: Document Stage 6 architecture skip
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}')
              return text.replace(old, new, 1)

          path = Path('WORKFLOW-STATE.md')
          text = path.read_text(encoding='utf-8')
          old = '''## 4. Architecture Decision

- Separate `ARCHITECTURE.md`: Undecided
- Reason: Lite profile does not require a separate architecture artifact unless later evidence reveals a material structural concern. Current scope is a static Astro landing page.
- Evidence and constraints: `SRC-DS-001`, `SRC-REPO-001`, root `AGENTS.md`, and `frontend/AGENTS.md`.
- Recorded by: Workflow agent; final Stage 6 decision remains gated.

When architecture is skipped, behavioral structural constraints will remain in the Lite implementation brief and repository/implementation structure will be documented in its planning section.
'''
          new = '''## 4. Architecture Decision

- Separate `ARCHITECTURE.md`: **Not required** for the current Lite scope.
- Reason: Stage 6 repository inspection confirms one `frontend/src/pages/index.astro` route, a starter Astro component/layout structure, Astro as the only application dependency, an empty `astro.config.mjs`, and no backend, API, persistence, authentication, shared state, client-framework integration, migration, or server-runtime concern. The approved Stage 4 specification explicitly excludes those product behaviors.
- Evidence and constraints: `SRC-DS-001`, `SRC-REPO-001`, root `AGENTS.md`, `frontend/AGENTS.md`, `frontend/package.json`, `frontend/src/pages/index.astro`, `frontend/astro.config.mjs`, and `frontend/vercel.json`.
- Consequence: Behavioral structural constraints remain in the Lite specification section of `IMPLEMENTATION-BRIEF.md`; concrete repository/module structure belongs to the Stage 7 plan. No `ARCHITECTURE.md` or ADR is created.
- Recorded by: Workflow agent on 2026-08-16; Stage 6 remains gated pending explicit project-owner approval.
'''
          text = replace_once(text, old, new, 'workflow architecture decision')
          path.write_text(text, encoding='utf-8')

          path = Path('IMPLEMENTATION-BRIEF.md')
          text = path.read_text(encoding='utf-8')
          old = '''## 7. Architecture Decision

- Separate architecture needed: Pending Stage 6 assessment.
- Reason: The current approved scope remains a static single-page Astro implementation with no meaningful routing, shared state, persistence, authentication, integration, or migration concern. Final architecture-skip handling belongs to Stage 6.
'''
          new = '''## 7. Architecture Decision

- Separate architecture needed: **No — Stage 6 recommends an explicit architecture skip.**
- Reason: Current repository evidence shows a single Astro page route, starter component/layout structure, Astro as the only application dependency, no configured Astro adapter/integration, and no backend, API, persistence, authentication, shared state, migration, or server-runtime requirement. The approved specification already constrains the experience to static links and content with no unsupported product flow.
- Evidence: `SRC-REPO-001`, `SRC-DS-001`, `frontend/package.json`, `frontend/src/pages/index.astro`, `frontend/astro.config.mjs`, `frontend/vercel.json`, `SPEC-BEH-003`, and `SPEC-VAL-001`.
- Structural handling without a separate artifact: semantic structure, link behavior, accessibility, responsive interpolation, and no-client-JavaScript expectations remain owned by the specification; Stage 7 will define the concrete component/file plan and validation commands.

### Stage 6 architecture review

- [x] No meaningful routing architecture is required; the approved implementation has one page route.
- [x] No shared application state, data ownership, API, persistence, authentication, authorization, or integration boundary exists in scope.
- [x] No migration, deployment topology, security/privacy boundary, reliability subsystem, or rollback design requires a separate architecture artifact.
- [x] Existing Astro/Vercel configuration is minimal and does not introduce server-runtime architecture.
- [x] The work remains within Lite profile limits.

`Ready for Stage 6 gated approval` — record the architecture skip only after explicit project-owner approval; do not advance to Stage 7 before that gate passes.
'''
          text = replace_once(text, old, new, 'implementation brief architecture decision')
          text = replace_once(
              text,
              '- None at the Stage 5 documentation-consistency checkpoint.',
              '- None at the Stage 6 architecture checkpoint.',
              'blocking checkpoint label',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Review updated Lite brief and validate Stage 6
        run: |
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI artifact review IMPLEMENTATION-BRIEF \
            --evidence "Stage 6 architecture skip is documented from current repository evidence; the brief remains internally consistent and no separate architecture artifact or profile upgrade is required."
          $CLI sync
          $CLI validate
          $CLI sync --check
          $CLI context --json
          $CLI stage check --json

      - name: Commit Stage 6 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-6-architecture.yml
          git add .workflow WORKFLOW-STATE.md IMPLEMENTATION-BRIEF.md
          git commit -m "Document Stage 6 architecture decision"
          git push origin HEAD:workflow/stage-6-architecture
